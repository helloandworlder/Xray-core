syntax = "proto3";

package xray.app.userratelimit.command;
option csharp_namespace = "Xray.App.UserRateLimit.Command";
option go_package = "github.com/xtls/xray-core/app/userratelimit/command";
option java_package = "com.xray.app.userratelimit.command";
option java_multiple_files = true;

message SetUserRateLimitRequest {
  string email = 1;
  int64 uplink_bps = 2;
  int64 downlink_bps = 3;
}

message SetUserRateLimitResponse {}

message RemoveUserRateLimitRequest {
  string email = 1;
}

message RemoveUserRateLimitResponse {}

message GetUserRateLimitRequest {
  string email = 1;
}

message GetUserRateLimitResponse {
  bool exists = 1;
  int64 uplink_bps = 2;
  int64 downlink_bps = 3;
}

message UserRateLimitItem {
  string email = 1;
  int64 uplink_bps = 2;
  int64 downlink_bps = 3;
}

message ListUserRateLimitsRequest {}

message ListUserRateLimitsResponse {
  repeated UserRateLimitItem items = 1;
}

service UserRateLimitService {
  rpc SetUserRateLimit(SetUserRateLimitRequest) returns (SetUserRateLimitResponse) {}

  rpc RemoveUserRateLimit(RemoveUserRateLimitRequest) returns (RemoveUserRateLimitResponse) {}

  rpc GetUserRateLimit(GetUserRateLimitRequest) returns (GetUserRateLimitResponse) {}

  rpc ListUserRateLimits(ListUserRateLimitsRequest) returns (ListUserRateLimitsResponse) {}
}

message Config {}
