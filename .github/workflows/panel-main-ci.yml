name: panel-main-ci

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".github/workflows/panel-main-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "panel/**"
      - ".github/workflows/panel-main-ci.yml"

concurrency:
  group: panel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel-presence:
    runs-on: ubuntu-latest
    outputs:
      has_panel: ${{ steps.check.outputs.has_panel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect panel workspace
        id: check
        run: |
          if [ -f panel/go.mod ] && [ -f panel/web/package.json ]; then
            echo "has_panel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_panel=false" >> "$GITHUB_OUTPUT"
          fi

  backend-test:
    needs: panel-presence
    if: needs.panel-presence.outputs.has_panel == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: panel/go.mod
          check-latest: true

      - name: Download Go modules
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Backend and agent tests
        run: go test ./...

  frontend-build:
    needs: panel-presence
    if: needs.panel-presence.outputs.has_panel == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: panel/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
