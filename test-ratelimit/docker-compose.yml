version: '3.8'

services:
  xray:
    build:
      context: ..
      dockerfile: test-ratelimit/Dockerfile
    ports:
      - "10808:10808"
    networks:
      - testnet

  speedtest:
    image: nginx:alpine
    volumes:
      - ./speedtest:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    networks:
      - testnet

networks:
  testnet:
    driver: bridge
